<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avery R. Dowd</title>

<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
<link rel="icon" type="image/x-icon" href="images/favicon.ico">

</head>

<body class="subway-home">

<div id="container">
    <button class="subway-menu-toggle" type="button" aria-controls="menu" aria-expanded="false">MENU</button>
    <div id="menu">
        <div id="logo">
            <a><img src="images/signature_v4.jpg" alt="Avery R. Dowd"></a>
        </div>
        <div id="menuoptions">
            <div id="home">
                <a class="menubtns" href="index.html">HOME</a>
            </div>
            <div id="work">
                <a class="menubtns" href="work.html">WORK</a>
            </div>
            <div id="archive">
                <a class="menubtns" href="archive.html">ARCHIVE</a>
            </div>
            <div id="about">
                <a class="menubtns" href="about.html">ABOUT</a>
            </div>
        </div>
        <div id="resume">
            <a class="menubtns resumelink" href="images/ADowd_Resume.pdf" download>RESUME/CV</a>
        </div>
    </div>
    <div id="content" class="subway-content">
        <main class="subway-poster" aria-labelledby="subway-title">
            <div id="right" class="subway-right">
                <div id="previewimages">
                    <div class="subway-index-block">
                        <div class="subway-text subway-index">[2026]</div>
                        <a class="subway-text subway-selected projectnavbtn projectnavbtn-back" href="work.html" data-project="Enter my Portfolio">SELECTED WORKS</a>
                    </div>
                    <figure class="subway-figure">
                        <video class="subway-video" src="images/subwayvideo.mov" autoplay muted loop playsinline preload="auto" aria-label="Orange subway interior"></video>
                        <figcaption class="subway-info">
                            <div class="subway-caption-copy">
                                <h1 id="subway-title" class="subway-text subway-name">AVERY R. DOWD</h1>
                                <div class="subway-text subway-role">VISUAL DESIGNER</div>
                                <div class="subway-text subway-city">NEW YORK CITY</div>
                            </div>
                        </figcaption>
                    </figure>
                </div>
            </div>
        </main>
    </div>
</div>

</body>
</html>
